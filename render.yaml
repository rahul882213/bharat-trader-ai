services:
  - type: web
    name: bharat-trader-ai-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt && python3 -m backend.database.init_db_script
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TRADING_MODE
        value: paper
      - key: ALLOWED_ORIGINS
        value: https://rahul882213.github.io
      - key: RATE_LIMIT_PER_MIN
        value: "120"
      - key: HEAVY_RATE_LIMIT_PER_MIN
        value: "30"
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
